<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f2efe7">
  <meta name="description"
    content="Персональная подготовка к вступительным испытаниям в СУНЦ по математике, русскому языку, литературе и истории.">
  <title>СУНЦ Prep 9</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #f2efe7;
      --paper-2: #e9e5db;
      --surface: #fbfaf6;
      --surface-2: #f6f3ec;
      --ink: #1d211d;
      --muted: #74786f;
      --line: #d8d4ca;
      --line-strong: #c3beb2;
      --accent: #b34f3b;
      --accent-2: #863a2c;
      --success: #3f6b53;
      --success-bg: #e4eee6;
      --danger: #a33f38;
      --danger-bg: #f4e4e1;
      --warning: #96703b;
      --warning-bg: #f3eadb;
      --math: #3e6653;
      --rus: #915e32;
      --lit: #6c5169;
      --history: #3e5e73;
      --white: #fffefa;
      --sidebar: 268px;
      --content: 1180px;
      --radius: 14px;
      --shadow: 0 12px 30px rgba(42, 40, 34, .08);
      --shadow-soft: 0 5px 18px rgba(42, 40, 34, .06);
      --display: 'DM Serif Display', Georgia, serif;
      --body: 'Manrope', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      overflow-x: hidden
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    :focus-visible {
      outline: 3px solid rgba(179, 79, 59, .38);
      outline-offset: 3px
    }

    ::selection {
      background: #e7c5bc;
      color: var(--ink)
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) 1fr
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid var(--line);
      background: rgba(242, 239, 231, .94);
      display: flex;
      flex-direction: column;
      padding: 24px 18px 18px;
      z-index: 30;
      backdrop-filter: blur(8px)
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 3px 9px 25px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px
    }

    .brand-mark {
      width: 31px;
      height: 37px;
      position: relative;
      flex: 0 0 auto
    }

    .brand-mark:before {
      content: "";
      position: absolute;
      left: 9px;
      top: 0;
      width: 4px;
      height: 37px;
      background: var(--accent);
      border-radius: 2px
    }

    .brand-mark:after {
      content: "";
      position: absolute;
      right: 2px;
      top: 7px;
      width: 11px;
      height: 11px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--paper)
    }

    .brand-text strong {
      display: block;
      font-size: 15px;
      letter-spacing: -.02em
    }

    .brand-text span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 1px
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .nav-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 9px 11px 5px
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #4e524c;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, .45);
      border-color: var(--line);
      transform: translateX(2px)
    }

    .nav-link.active {
      background: var(--surface);
      border-color: var(--line-strong);
      color: var(--ink);
      box-shadow: var(--shadow-soft)
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      color: currentColor;
      flex: 0 0 auto
    }

    .nav-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .nav-link span:nth-child(2) {
      font-weight: 700;
      font-size: 13px
    }

    .sidebar-bottom {
      margin-top: auto;
      display: grid;
      gap: 10px
    }

    .user-chip {
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 11px
    }

    .user-chip .eyebrow {
      margin-bottom: 2px
    }

    .user-chip strong {
      display: block;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: var(--ink);
      transition: .16s ease
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      background: var(--white);
      transform: translateY(-1px)
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .main {
      min-width: 0
    }

    .topbar {
      height: 68px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      background: rgba(242, 239, 231, .82);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px)
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0
    }

    .mobile-menu {
      display: none
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .breadcrumb strong {
      color: var(--ink);
      font-weight: 700
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .search-trigger {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 38px;
      padding: 0 11px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 9px;
      color: var(--muted);
      min-width: 184px;
      text-align: left
    }

    .search-trigger:hover {
      border-color: var(--line-strong)
    }

    .search-trigger svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .shortcut {
      margin-left: auto;
      border: 1px solid var(--line);
      background: var(--paper-2);
      border-radius: 5px;
      padding: 1px 5px;
      font-family: var(--mono);
      font-size: 10px;
      color: #62665e
    }

    .page-wrap {
      max-width: calc(var(--content) + 80px);
      margin: 0 auto;
      padding: 34px 40px 70px
    }

    .view {
      animation: viewIn .24s ease both
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(5px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .page-title {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(36px, 4vw, 58px);
      line-height: 1.02;
      letter-spacing: -.035em;
      margin: 7px 0 8px
    }

    .page-subtitle {
      max-width: 720px;
      color: #5e625a;
      margin: 0
    }

    .mono {
      font-family: var(--mono)
    }

    .text-muted {
      color: var(--muted)
    }

    .stack {
      display: grid;
      gap: 18px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .wrap {
      flex-wrap: wrap
    }

    .spread {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 14px
    }

    .section-head h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.025em
    }

    .section-head p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .rule {
      height: 1px;
      background: var(--line);
      border: 0;
      margin: 24px 0
    }

    .signature-line {
      height: 1px;
      background: var(--ink);
      width: 100%;
      position: relative;
      margin: 27px 0 22px
    }

    .signature-line:before {
      content: "";
      position: absolute;
      left: 0;
      top: -2px;
      width: 28%;
      max-width: 210px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px
    }

    .home-lead {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);
      gap: 26px;
      align-items: stretch;
      margin-bottom: 27px
    }

    .lead-copy {
      padding: 15px 0 4px
    }

    .lead-kicker {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .1em
    }

    .lead-kicker:before {
      content: "";
      width: 22px;
      height: 2px;
      background: var(--accent)
    }

    .lead-copy h1 {
      font-family: var(--display);
      font-size: clamp(48px, 6vw, 78px);
      font-weight: 400;
      line-height: .95;
      letter-spacing: -.045em;
      margin: 13px 0 17px;
      max-width: 820px
    }

    .lead-copy h1 em {
      font-style: normal;
      color: var(--accent)
    }

    .lead-copy p {
      max-width: 680px;
      font-size: 16px;
      color: #5e625b;
      margin: 0
    }

    .continue-card {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 19px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 250px;
      position: relative;
      overflow: hidden
    }

    .continue-card:after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: var(--accent)
    }

    .continue-card h3 {
      margin: 2px 0 6px;
      font-size: 23px;
      letter-spacing: -.03em;
      line-height: 1.18
    }

    .continue-card .week-stamp {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted)
    }

    .continue-progress {
      margin: 16px 0 12px
    }

    .progress-track {
      height: 7px;
      background: #dedbd2;
      border-radius: 99px;
      overflow: hidden
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      width: 0;
      transition: width .3s ease
    }

    .progress-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(251, 250, 246, .38)
    }

    .kpi {
      padding: 17px 16px 19px;
      border-right: 1px solid var(--line);
      min-width: 0
    }

    .kpi:last-child {
      border-right: 0
    }

    .kpi-value {
      font-family: var(--display);
      font-size: 38px;
      line-height: 1;
      margin: 2px 0 6px;
      letter-spacing: -.03em
    }

    .kpi-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-family: var(--mono)
    }

    .kpi-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px
    }

    .today-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 27px
    }

    .study-list {
      display: grid;
      gap: 8px
    }

    .study-item {
      display: grid;
      grid-template-columns: 35px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      padding: 13px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px;
      transition: .16s ease
    }

    .study-item:hover {
      border-color: var(--line-strong);
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft)
    }

    .study-num {
      width: 29px;
      height: 29px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: var(--paper)
    }

    .study-item strong {
      display: block;
      font-size: 13px;
      line-height: 1.3
    }

    .study-item span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px
    }

    .item-arrow {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--muted)
    }

    .item-arrow svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .surface {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft)
    }

    .panel {
      padding: 18px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 13px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 12px;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: #99948a;
      box-shadow: 0 4px 10px rgba(40, 38, 34, .06)
    }

    .btn:active {
      transform: translateY(0)
    }

    .btn.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #fffefa
    }

    .btn.primary:hover {
      background: #2c302c
    }

    .btn.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fffefa
    }

    .btn.accent:hover {
      background: var(--accent-2);
      border-color: var(--accent-2)
    }

    .btn.soft {
      background: var(--paper-2);
      border-color: var(--line)
    }

    .btn.success {
      background: var(--success-bg);
      border-color: #b9cdbc;
      color: #2f5c43
    }

    .btn.danger {
      background: var(--danger-bg);
      border-color: #e2b9b3;
      color: #87342e
    }

    .btn.small {
      min-height: 34px;
      padding: 6px 10px;
      font-size: 11px
    }

    .btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffdf8;
      color: var(--ink);
      border-radius: 9px;
      padding: 9px 11px;
      min-height: 40px;
      outline: 0;
      transition: border-color .16s ease, box-shadow .16s ease
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: #99948a;
      box-shadow: 0 0 0 3px rgba(179, 79, 59, .09)
    }

    .textarea {
      resize: vertical;
      min-height: 120px
    }

    .field {
      display: grid;
      gap: 6px
    }

    .field label {
      font-size: 11px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--muted)
    }

    .subject-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: end;
      margin-bottom: 23px
    }

    .subject-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px
    }

    .subject-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor
    }

    .subject-heading h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 48px;
      line-height: 1;
      letter-spacing: -.04em;
      font-weight: 400
    }

    .subject-heading p {
      max-width: 690px;
      margin: 9px 0 0;
      color: var(--muted)
    }

    .subject-stats {
      display: flex;
      gap: 10px;
      align-items: flex-end
    }

    .stat-mini {
      border-left: 1px solid var(--line);
      padding-left: 12px;
      min-width: 82px
    }

    .stat-mini strong {
      display: block;
      font-family: var(--display);
      font-size: 28px;
      line-height: 1
    }

    .stat-mini span {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: .08em
    }

    .subject-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 170px auto;
      gap: 9px;
      margin-bottom: 17px
    }

    .subject-list {
      display: grid;
      gap: 9px
    }

    .topic-card {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 16px 15px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: .16s ease
    }

    .topic-card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow-soft);
      transform: translateY(-1px)
    }

    .topic-week {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      align-self: start;
      padding-top: 3px
    }

    .topic-main h3 {
      font-size: 15px;
      line-height: 1.25;
      margin: 0 0 4px;
      letter-spacing: -.01em
    }

    .topic-main p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .topic-side {
      display: grid;
      justify-items: end;
      gap: 8px
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid var(--line)
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #aaa
    }

    .status.done {
      background: var(--success-bg);
      border-color: #c4d3c6;
      color: #3c644d
    }

    .status.done .status-dot {
      background: var(--success)
    }

    .status.progress {
      background: var(--warning-bg);
      border-color: #dbc9a6;
      color: #76572a
    }

    .status.progress .status-dot {
      background: var(--warning)
    }

    .status.todo {
      color: var(--muted)
    }

    .subject-accent-math {
      color: var(--math)
    }

    .subject-accent-rus {
      color: var(--rus)
    }

    .subject-accent-lit {
      color: var(--lit)
    }

    .subject-accent-history {
      color: var(--history)
    }

    .topic-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 285px;
      gap: 22px;
      margin-bottom: 20px
    }

    .topic-hero-main {
      padding: 18px 0 3px;
      border-bottom: 1px solid var(--line)
    }

    .topic-hero-main .topic-kicker {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .12em
    }

    .topic-hero-main h1 {
      font-family: var(--display);
      font-size: 48px;
      line-height: 1.03;
      letter-spacing: -.04em;
      font-weight: 400;
      margin: 7px 0 10px
    }

    .topic-hero-main p {
      max-width: 750px;
      color: #5c6058;
      margin: 0
    }

    .topic-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 15px
    }

    .topic-side-note {
      border-left: 3px solid var(--accent);
      padding: 10px 0 10px 16px;
      align-self: end
    }

    .topic-side-note strong {
      font-family: var(--display);
      font-size: 34px;
      font-weight: 400;
      display: block;
      line-height: 1
    }

    .topic-side-note span {
      font-size: 11px;
      color: var(--muted)
    }

    .two-col {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px
    }

    .three-col {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px
    }

    .info-block {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px
    }

    .info-block h3 {
      margin: 0 0 9px;
      font-size: 14px
    }

    .info-block ul {
      margin: 0;
      padding-left: 18px;
      color: #5c6058;
      font-size: 13px
    }

    .info-block li+li {
      margin-top: 5px
    }

    .callout {
      padding: 14px 15px;
      background: var(--paper-2);
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      color: #565a53;
      font-size: 13px
    }

    .formula {
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      background: #f0ede5;
      border: 1px solid var(--line);
      padding: 10px 12px;
      border-radius: 8px;
      color: #3f433d
    }

    .codeish {
      font-family: var(--mono);
      font-size: 12px
    }

    .task-grid {
      display: grid;
      gap: 10px
    }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 14px
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px
    }

    .task-number {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em
    }

    .difficulty {
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 4px 7px;
      border-radius: 6px;
      border: 1px solid var(--line);
      color: var(--muted)
    }

    .difficulty.easy {
      background: #eef0e9;
      color: #4f654d
    }

    .difficulty.medium {
      background: #f2eadf;
      color: #7b5e3e
    }

    .difficulty.hard {
      background: #f4e3de;
      color: #863f35
    }

    .task-condition {
      font-size: 14px;
      color: #30342f;
      margin: 0 0 11px
    }

    .task-meta {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
      margin-bottom: 10px
    }

    .task-answer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px
    }

    .task-result {
      margin-top: 9px;
      padding: 10px 11px;
      border-radius: 8px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: #f7f5ef
    }

    .task-result.correct {
      background: var(--success-bg);
      border-color: #bfd0c2;
      color: #305b42
    }

    .task-result.wrong {
      background: var(--danger-bg);
      border-color: #e2beb8;
      color: #7b322c
    }

    .task-solution {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(0, 0, 0, .08);
      color: inherit
    }

    .test-list {
      display: grid;
      gap: 9px
    }

    .test-card {
      padding: 15px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px
    }

    .test-question {
      font-size: 14px;
      margin: 0 0 11px;
      font-weight: 700
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 420px
    }

    th,
    td {
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 12px;
      vertical-align: top
    }

    th {
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      background: var(--paper-2)
    }

    tr:last-child td {
      border-bottom: 0
    }

    .timeline {
      position: relative;
      margin-top: 10px
    }

    .timeline:before {
      content: "";
      position: absolute;
      left: 31px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--line-strong)
    }

    .week-card {
      position: relative;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 14px;
      margin-bottom: 12px
    }

    .week-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--line-strong);
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 9px;
      z-index: 1;
      margin-left: 17px;
      margin-top: 15px
    }

    .week-card.current .week-marker {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff
    }

    .week-card.done .week-marker {
      border-color: var(--success);
      background: var(--success);
      color: #fff
    }

    .week-body {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 15px 16px;
      transition: .16s ease
    }

    .week-card.current .week-body {
      border-color: #caa69d;
      box-shadow: var(--shadow-soft)
    }

    .week-body:hover {
      border-color: var(--line-strong)
    }

    .week-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start
    }

    .week-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.25
    }

    .week-hours {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap
    }

    .week-subjects {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 12px
    }

    .week-subject {
      border-top: 2px solid var(--line);
      padding-top: 7px;
      min-width: 0
    }

    .week-subject .tag {
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      display: block;
      margin-bottom: 3px
    }

    .week-subject strong {
      font-size: 11px;
      line-height: 1.3;
      display: block
    }

    .week-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid var(--line)
    }

    .week-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 160px
    }

    .week-progress .progress-track {
      flex: 1
    }

    .lit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px
    }

    .work-card {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: grid;
      gap: 12px
    }

    .work-head {
      display: flex;
      gap: 12px;
      align-items: flex-start
    }

    .work-index {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      padding-top: 4px;
      width: 25px;
      flex: 0 0 auto
    }

    .work-card h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: -.015em
    }

    .work-card h3 span {
      font-weight: 500;
      color: var(--muted)
    }

    .work-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px
    }

    .chip {
      font-size: 10px;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper-2);
      color: #62665e
    }

    .work-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .checkbox-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      background: var(--paper-2);
      color: #5b5f58;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 10px;
      font-weight: 700
    }

    .checkbox-button.done {
      background: var(--success-bg);
      border-color: #bed0c1;
      color: #315d43
    }

    .checkbox-button .check {
      width: 14px;
      height: 14px;
      border: 1px solid currentColor;
      border-radius: 4px;
      display: grid;
      place-items: center
    }

    .checkbox-button.done .check:after {
      content: "✓";
      font-family: var(--mono);
      font-size: 10px
    }

    .detail-sheet {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
      overflow: hidden
    }

    .detail-section {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line)
    }

    .detail-section:last-child {
      border-bottom: 0
    }

    .detail-section h2 {
      font-size: 18px;
      margin: 0 0 11px;
      letter-spacing: -.02em
    }

    .detail-section p {
      margin: 0;
      color: #555a52;
      font-size: 13px
    }

    .detail-section p+p {
      margin-top: 9px
    }

    details {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      margin-top: 11px
    }

    details+details {
      margin-top: 8px
    }

    summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px
    }

    summary::-webkit-details-marker {
      display: none
    }

    summary:before {
      content: "+";
      font-family: var(--mono);
      color: var(--accent);
      font-size: 11px
    }

    details[open] summary:before {
      content: "−"
    }

    .details-content {
      padding: 9px 0 2px;
      color: #5b6058;
      font-size: 12px
    }

    .quote {
      font-family: var(--display);
      font-size: 22px;
      line-height: 1.25;
      color: #383c37;
      margin: 0;
      padding-left: 17px;
      border-left: 3px solid var(--accent)
    }

    .flash-shell {
      max-width: 860px;
      margin: 0 auto
    }

    .flash-stage {
      perspective: 1300px;
      margin: 20px auto 15px;
      min-height: 360px
    }

    .flash-card {
      min-height: 360px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .48s cubic-bezier(.2, .7, .2, 1);
      cursor: pointer
    }

    .flash-card.flipped {
      transform: rotateY(180deg)
    }

    .flash-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 42px;
      text-align: center
    }

    .flash-back {
      transform: rotateY(180deg);
      background: #f7f5ee
    }

    .flash-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      margin-bottom: 18px
    }

    .flash-question {
      font-family: var(--display);
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.09;
      letter-spacing: -.03em
    }

    .flash-answer {
      font-size: 20px;
      line-height: 1.35;
      color: #4d534c;
      max-width: 650px;
      margin: 0 auto
    }

    .flash-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .flash-progress {
      margin: 0 auto 13px;
      max-width: 600px
    }

    .flash-setup {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 8px;
      margin-top: 15px
    }

    .quiz-shell {
      max-width: 860px;
      margin: 0 auto
    }

    .quiz-setup {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      margin: 16px 0
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px
    }

    .quiz-progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 11px
    }

    .quiz-progress-head strong {
      font-family: var(--mono);
      font-size: 11px
    }

    .quiz-progress-head span {
      font-size: 11px;
      color: var(--muted)
    }

    .quiz-question {
      font-family: var(--display);
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -.03em;
      margin: 6px 0 18px
    }

    .quiz-options {
      display: grid;
      gap: 8px
    }

    .quiz-option {
      width: 100%;
      text-align: left;
      padding: 12px 13px;
      border: 1px solid var(--line);
      background: #fffdf8;
      border-radius: 10px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
      transition: .16s ease
    }

    .quiz-option:hover:not([disabled]) {
      border-color: #9c978c;
      transform: translateY(-1px)
    }

    .quiz-option .letter {
      width: 23px;
      height: 23px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 10px;
      flex: 0 0 auto
    }

    .quiz-option.selected {
      border-color: #9d5f53;
      background: #f5e9e5
    }

    .quiz-option.correct {
      border-color: #a9c2ae;
      background: var(--success-bg)
    }

    .quiz-option.wrong {
      border-color: #d9aaa4;
      background: var(--danger-bg)
    }

    .quiz-explanation {
      padding: 12px 13px;
      border-left: 3px solid var(--accent);
      background: var(--paper-2);
      border-radius: 0 9px 9px 0;
      margin-top: 14px;
      font-size: 12px;
      color: #575c54
    }

    .quiz-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 17px
    }

    .result-hero {
      text-align: center;
      padding: 28px 10px 24px
    }

    .result-score {
      font-family: var(--display);
      font-size: 72px;
      line-height: .9;
      letter-spacing: -.045em
    }

    .result-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-top: 8px
    }

    .mistake-list {
      display: grid;
      gap: 8px;
      margin-top: 15px
    }

    .mistake-item {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fffdf8;
      font-size: 12px
    }

    .plan-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 15px 0
    }

    .progress-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px
    }

    .progress-card {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px
    }

    .progress-big {
      font-family: var(--display);
      font-size: 44px;
      line-height: 1;
      margin: 7px 0
    }

    .progress-card .progress-track {
      margin-top: 11px
    }

    .result-row {
      display: grid;
      grid-template-columns: 95px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      font-size: 11px
    }

    .result-date {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted)
    }

    .error-view {
      max-width: 760px;
      margin: 13vh auto;
      padding: 30px;
      background: var(--surface);
      border: 1px solid #d4aaa3;
      border-radius: 16px;
      box-shadow: var(--shadow)
    }

    .error-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #d4aaa3;
      background: var(--danger-bg);
      color: var(--danger);
      display: grid;
      place-items: center;
      margin-bottom: 13px
    }

    .error-mark svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .error-view h1 {
      font-family: var(--display);
      font-size: 38px;
      font-weight: 400;
      margin: 0 0 8px
    }

    .error-view p {
      color: var(--muted);
      margin: 0 0 16px
    }

    .error-view pre {
      white-space: pre-wrap;
      font-family: var(--mono);
      font-size: 11px;
      background: #f0ede5;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 11px;
      color: #535850
    }

    .loading-view {
      padding: 45px 0
    }

    .skeleton {
      height: 17px;
      border: 1px solid var(--line);
      background: #e9e6de;
      border-radius: 7px;
      animation: skel 1.1s ease-in-out infinite
    }

    .skeleton.big {
      height: 74px;
      width: 65%
    }

    .skeleton.mid {
      height: 30px;
      width: 40%
    }

    .sk-grid {
      display: grid;
      gap: 10px;
      margin-top: 20px
    }

    .sk-grid .skeleton:nth-child(2) {
      width: 90%
    }

    .sk-grid .skeleton:nth-child(3) {
      width: 77%
    }

    @keyframes skel {
      50% {
        opacity: .48
      }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(30, 31, 28, .28);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px
    }

    .modal-backdrop.open {
      display: flex
    }

    .modal {
      width: min(680px, 100%);
      max-height: min(86vh, 760px);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 15px;
      box-shadow: 0 24px 60px rgba(20, 20, 18, .22);
      padding: 19px
    }

    .modal.large {
      width: min(860px, 100%)
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 15px;
      margin-bottom: 15px
    }

    .modal-head h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.025em
    }

    .modal-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 17px
    }

    .modal-grid {
      display: grid;
      gap: 11px
    }

    .search-input-wrap {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .search-results {
      margin-top: 13px;
      display: grid;
      gap: 15px
    }

    .search-group h3 {
      font-size: 11px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 0 0 6px
    }

    .search-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid var(--line);
      padding: 10px 11px;
      border-radius: 9px;
      display: flex;
      justify-content: space-between;
      gap: 12px
    }

    .search-item:hover {
      border-color: var(--line-strong);
      background: var(--paper-2)
    }

    .search-item strong {
      font-size: 12px
    }

    .search-item span {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap

    }

      }

        animation: none
      }

      * {
        scroll-behavior: auto !important;
        transition: none !important
      }

      .progress-fill {
        transition: none
      }
    }

      function renderSubject(subject) {
        if (subject === 'literature') return renderLiterature();
        const weeks = subjectWeeks(subject);
        const meta = SUBJECT_META[subject];
        const prog = subjectProgress(subject);
        const difficulty = viewState.filters.subjectDifficulty[subject] || 'all';
        const query = (viewState.filters.subjectSearch[subject] || '').toLowerCase().trim();
        const topics = weeks.filter(w => {
          const text = `${w.title || ''} ${w.explanation || ''} ${w.section || ''}`.toLowerCase();
          return (!query || text.includes(query)) && (
            difficulty === 'all' || [w.training_tasks, w.advanced_tasks].some(a => arr(a).some(t => t.difficulty === difficulty))
          );
        });
        return `<div class="view">
    <div class="subject-head ${meta.className}">
      <div class="subject-mark" aria-hidden="true">${icon(meta.icon)}</div>
      <div class="subject-heading"><div class="eyebrow">${esc(meta.eyebrow)}</div><h1>${esc(meta.label)}</h1><p>${esc(meta.description)}</p></div>
      <div class="subject-stats"><strong>${prog}%</strong><span>тем отмечено</span>${progressBar(prog, '')}</div>
    </div>
    <div class="subject-toolbar">
      <label class="field"><span>Поиск тем</span><input class="input" type="search" value="${escAttr(viewState.filters.subjectSearch[subject] || '')}" data-subject-search="${subject}" placeholder="Название темы"></label>
      <label class="field"><span>Сложность</span><select class="select" data-subject-difficulty="${subject}">
        <option value="all" ${difficulty === 'all' ? 'selected' : ''}>Все уровни</option>
        <option value="easy" ${difficulty === 'easy' ? 'selected' : ''}>Базовый</option>
        <option value="medium" ${difficulty === 'medium' ? 'selected' : ''}>Средний</option>
        <option value="hard" ${difficulty === 'hard' ? 'selected' : ''}>Повышенный</option>
      </select></label>
    </div>
    ${topics.length ? `<div class="subject-list">${topics.map(w => subjectTopicCard(w, subject)).join('')}</div>` : `<div class="empty-state panel"><strong>Ничего не найдено</strong><span>Измени запрос или сбрось фильтр.</span>${btn('Сбросить фильтры', 'reset-subject-filter', { small: true, data: `data-subject="${subject}"` })}</div>`}
  </div>`;
      }
      function subjectTopicCard(w, subject) {
        const status = weekStatus(w.week);
        const tasks = arr(w.training_tasks).length + arr(w.advanced_tasks).length;
        return `<article class="topic-card">
    <div class="topic-week">W${String(w.week).padStart(2, '0')}</div>
    <div class="topic-main"><h3>${esc(w.title || w.mathematics_topic || w.russian_topic || w.history_topic || '')}</h3><p>${esc(w.explanation || w.summary || 'Материал недели с теорией и практикой.')}</p></div>
    <div class="topic-side">${statusPill(status)}<span class="text-muted small">${tasks} задач</span>${btn('Открыть', 'open-topic', { small: true, data: `data-subject="${subject}" data-week="${w.week}"` })}</div>
  </article>`;
      }

      function renderLiterature() {
        const works = arr(data.subjects?.literature?.works);
        const filter = viewState.filters.literature;
        const query = filter.query.toLowerCase().trim();
        const list = works.filter(w => {
          const hay = `${w.author || ''} ${w.title || ''} ${w.genre || ''} ${arr(w.themes).join(' ')}`.toLowerCase();
          return (!query || hay.includes(query)) && (filter.period === 'all' || literaturePeriod(w.year) === filter.period);
        });
        const read = works.filter(w => readWork(w.id)).length;
        return `<div class="view">
    ${layoutHeader('26 произведений', 'Литература', 'Читай ради анализа: конфликтов, авторской позиции, деталей и связи с историческим контекстом.')}
    <div class="subject-toolbar">
      <label class="field"><span>Поиск</span><input class="input" type="search" value="${escAttr(filter.query)}" data-lit-search placeholder="Автор, произведение, тема"></label>
      <label class="field"><span>Период</span><select class="select" data-lit-period>
        <option value="all" ${filter.period === 'all' ? 'selected' : ''}>Все периоды</option>
        <option value="classic" ${filter.period === 'classic' ? 'selected' : ''}>XVIII–XIX века</option>
        <option value="modern" ${filter.period === 'modern' ? 'selected' : ''}>XX век</option>
      </select></label>
      <div class="topic-side" style="align-content:end">${progressBar(percent(read, works.length), 'Прочитано')}</div>
    </div>
    ${list.length ? `<div class="lit-grid">${list.map((w, i) => workCard(w, i + 1)).join('')}</div>` : `<div class="empty-state panel"><strong>Произведения не найдены</strong><span>Попробуй другой запрос.</span></div>`}
  </div>`;
      }
      function literaturePeriod(y) { return Number(y) >= 1900 ? 'modern' : 'classic' }
      function workCard(w, index) {
        const done = readWork(w.id), edone = analysisDone(w.id), essay = arr(data.subjects?.literature?.essays).find(e => arr(e.suitable_works).some(x => String(x).toLowerCase().includes(String(w.title).toLowerCase())));
        return `<article class="work-card ${done ? 'done' : ''}">
    <div class="work-index">${String(index).padStart(2, '0')}</div>
    <div class="work-head"><div><div class="eyebrow">${esc(w.author || '')}</div><h2>${esc(w.title || '')}</h2></div><span class="chip">${esc(String(w.year || '—'))}</span></div>
    <div class="work-meta">${chip(w.genre || w.literary_kind || '')}${w.literary_kind ? chip(w.literary_kind) : ''}</div>

    <div class="work-actions">
      ${btn(done ? 'Прочитано' : 'Отметить прочитанным', 'toggle-read', { small: true, primary: !done, data: `data-work="${escAttr(w.id)}"` })}
      ${btn(essay && essayDone(essay.id) ? 'Сочинение отмечено' : 'Сочинение недели', 'open-work', { small: true, soft: true, data: `data-work="${escAttr(w.id)}" data-essay="${essay?.id || ''}"` })}
    </div>
  </article>`;
      }

      function renderHistory() {
        const weeks = subjectWeeks('history');
        const viewed = Object.values(state.progress.history_materials || {}).filter(Boolean).length;
        const total = arr(data.subjects?.history?.documentary_materials).length;

    <div class="callout"><div><strong>Дополнительные материалы: ${viewed}/${total}</strong><p>В базе указано ${total} рекомендованных материалов. Отметка «Просмотрено» влияет на прогресс истории.</p></div>${btn('Повторить даты', 'flashcards', { soft: true })}</div>
    <div class="timeline">
      ${weeks.map(w => historyCard(w)).join('')}
    </div>
  </div>`;
      }
      function historyCard(w) {

        const mat = getMaterialForWeek(w);
        return `<article class="week-card">
    <div class="week-top">
      <div class="week-marker">${String(w.week).padStart(2, '0')}</div>
      <div><div class="eyebrow">${esc(w.period || '')}</div><h2 class="week-title">${esc(w.title || '')}</h2></div>
      ${statusPill(status)}
    </div>
    <div class="week-body">
      <p>${esc(h.summary || '')}</p>
      <div class="chips">${arr(h.terms).slice(0, 8).map(t => chip(t)).join('')}</div>
      <div class="three-col" style="margin-top:15px">
        <div class="detail-section"><h3>Даты</h3><div class="tag-list">${arr(h.key_dates).slice(0, 15).map(x => `<span class="tag">${esc(String(x))}</span>`).join('')}</div></div>
        <div class="detail-section"><h3>Персоналии</h3><p>${arr(h.persons).slice(0, 8).map(esc).join(' · ') || 'Данные не указаны'}</p></div>

      </div>
      <div class="topic-actions">
        ${btn('Открыть тему', 'open-history-week', { primary: true, small: true, data: `data-week="${w.week}"` })}
        ${mat ? btn(materialDone(mat.id) ? 'Материал просмотрен' : 'Открыть материал', 'open-history-material', { small: true, soft: true, data: `data-material="${mat.id}" data-week="${w.week}"` }) : chip('Доп. материала для недели нет')}
      </div>
    </div>
  </article>`;
      }

      function renderWeekDetail(kind, n) {
        const map = { math: ['mathematics', getMathWeek], rus: ['russian_language', getRusWeek], hist: ['history', getHistWeek] };
        const spec = map[kind], subject = spec?.[0], getter = spec?.[1], w = getter ? getter(n) : null;
        if (!w) return errorView('Неделя не найдена', 'В базе нет материала для выбранной недели.');
        const cards = arr(w.flashcards), tests = arr(w.tests);
        return `<div class="view">
    <div class="breadcrumb" style="margin-bottom:15px"><button class="btn soft small" type="button" data-route="${subject === 'mathematics' ? 'math' : subject === 'russian_language' ? 'russian' : 'history'}">Назад</button><span>›</span><strong>Неделя ${n}</strong></div>
    <div class="topic-hero">
      <div class="topic-hero-main"><div class="topic-kicker">${esc(SUBJECT_META[subject].label)} · неделя ${n}</div><h1>${esc(w.title || w.mathematics_topic || w.russian_topic || w.history_topic || '')}</h1><p>${esc(w.explanation || w.summary || '')}</p></div>

    </div>
    ${subject === 'mathematics' ? renderMathDetail(w) : subject === 'russian_language' ? renderRusDetail(w) : renderHistDetail(w)}
  </div>`;
      }

      function renderMathDetail(w) {
        const done = topicDone('mathematics', w.id), tasks = [...arr(w.training_tasks), ...arr(w.advanced_tasks)];
        return `<div class="stack">
    <section class="panel">
      <div class="section-head"><div><div class="eyebrow">Теория</div><h2>Формулы и правила</h2></div>${btn(done ? 'Тема отмечена' : 'Отметить тему изученной', 'toggle-topic', { small: true, primary: !done, data: `data-subject="mathematics" data-id="${w.id}"` })}</div>
      ${arr(w.key_formulas).length ? `<div class="formula-grid">${arr(w.key_formulas).map(f => `<div class="formula">${esc(f)}</div>`).join('')}</div>` : ''}
      <div class="rule-list">${arr(w.rules).map(r => `<div class="rule"><span class="rule-mark">+</span><p>${esc(r)}</p></div>`).join('')}</div>
    </section>
    <section class="panel">
      <div class="section-head"><div><div class="eyebrow">Практика</div><h2>${tasks.length} задач</h2></div><span class="chip">${arr(w.advanced_tasks).length} повышенной сложности</span></div>
      <div class="task-grid">${tasks.map((t, i) => mathTask(t, w, i + 1)).join('')}</div>
    </section>
    ${renderInlineTests(w.tests, w.id, 'mathematics')}
    ${renderInlineCards(w.flashcards, w.id)}
  </div>`;
      }
      function mathTask(t, w, i) {
        const key = `${w.id}:task:${i}`, result = state.ui.taskResults[key];
        return `<article class="task-card ${result?.correct ? 'correct' : result ? 'wrong' : ''}">
    <div class="task-top"><span class="task-number">${String(i).padStart(2, '0')}</span><span class="difficulty ${t.difficulty}">${esc(levelLabel(t.difficulty))}</span></div>
    <div class="task-condition">${esc(t.condition)}</div>
    <div class="task-meta">${chip(t.topic || w.title || '')}</div>
    ${!result ? `<div class="row" style="margin-top:13px"><input class="input task-answer" type="text" aria-label="Ответ к задаче ${i}" data-task-input="${escAttr(key)}" placeholder="Введи ответ"><button class="btn primary small" type="button" data-action="check-task" data-task-key="${escAttr(key)}" data-task-answer="${escAttr(t.answer)}" data-task-solution="${escAttr(t.solution || '')}">Проверить</button></div>` :
            `<div class="task-result"><strong>${result.correct ? 'Верно' : 'Неверно'}</strong><span>Твой ответ: ${esc(result.value || '')}</span><span>Правильный ответ: ${esc(t.answer || '')}</span></div>
       ${t.solution ? `<div class="task-solution"><div class="eyebrow">Решение</div><p>${esc(t.solution)}</p></div>` : ''}`}
  </article>`;
      }

      function renderRusDetail(w) {
        const done = topicDone('russian_language', w.id);
        return `<div class="stack">
    <section class="panel">
      <div class="section-head"><div><div class="eyebrow">Правила</div><h2>Что нужно закрепить</h2></div>${btn(done ? 'Тема отмечена' : 'Отметить тему изученной', 'toggle-topic', { small: true, primary: !done, data: `data-subject="russian_language" data-id="${w.id}"` })}</div>
      <div class="rule-list">${arr(w.rules).map(r => `<div class="rule"><span class="rule-mark">+</span><p>${esc(r)}</p></div>`).join('')}</div>
    </section>
    <section class="panel">
      <div class="section-head"><div><div class="eyebrow">Примеры</div><h2>Разбор формулировок</h2></div><span class="mono">${arr(w.examples).length}</span></div>
      <div class="example-list">${arr(w.examples).map((x, i) => `<div class="surface"><span class="mono">${String(i + 1).padStart(2, '0')}</span><span>${esc(x)}</span></div>`).join('')}</div>
    </section>
    <section class="panel">
      <div class="section-head"><div><div class="eyebrow">Практика</div><h2>${arr(w.training_tasks).length} заданий</h2></div></div>
      <div class="task-grid">${arr(w.training_tasks).map((t, i) => mathTask(t, w, i + 1)).join('')}</div>
    </section>
    ${renderInlineTests(w.tests, w.id, 'russian_language')}
    ${renderInlineCards(w.flashcards, w.id)}
    ${w.common_errors ? `<section class="callout danger"><div><div class="eyebrow">Типичные ошибки</div><p>${esc(Array.isArray(w.common_errors) ? w.common_errors.join(' ') : w.common_errors)}</p></div></section>` : ''}
  </div>`;
      }

      function renderHistDetail(w) {
        const mat = getMaterialForWeek(w);
        return `<div class="stack">
    <section class="panel">
      <div class="section-head"><div><div class="eyebrow">Конспект</div><h2>Контекст и события</h2></div>${btn(topicDone('history', w.id) ? 'Тема отмечена' : 'Отметить тему изученной', 'toggle-topic', { small: true, primary: !topicDone('history', w.id), data: `data-subject="history" data-id="${w.id}"` })}</div>
      <p>${esc(w.summary || '')}</p>
      <div class="three-col" style="margin-top:16px">

      <div class="two-col" style="margin-top:16px">
        <div class="detail-section"><h3>Итоги</h3><p>${esc(arr(w.results).join(' '))}</p></div>
        <div class="detail-section"><h3>Последствия и значение</h3><p>${esc(arr(w.consequences).join(' '))}</p><p>${esc(w.significance || '')}</p></div>

    </section>
    <section class="panel">
      <div class="section-head"><div><div class="eyebrow">Память</div><h2>Даты и персоналии</h2></div></div>
      <div class="three-col">
        <div class="detail-section"><h3>Ключевые даты</h3><div class="tag-list">${arr(w.key_dates).map(x => `<span class="tag">${esc(String(x))}</span>`).join('')}</div></div>

        <div class="detail-section"><h3>Персоналии</h3><p>${arr(w.persons).map(esc).join(' · ')}</p></div>

    ${mat ? renderMaterial(mat) : ''}

    ${renderInlineCards(w.flashcards, w.id)}
    <section class="panel">
      <div class="section-head"><div><div class="eyebrow">Причинно-следственная связь</div><h2>Задания</h2></div></div>
      <div class="task-grid">${arr(w.causal_tasks).map((t, i) => causalTask(t, i + 1)).join('')}</div>
    </section>
  </div>`;
      }
      function renderMaterial(m) {
        const done = materialDone(m.id);
        const external = String(m.url || m.link || '').trim();
        return `<section class="callout">
    <div><div class="eyebrow">${esc(m.type || 'Дополнительный материал')}</div><h3>${esc(m.title || '')}</h3><p>${esc(m.why_watch || '')}</p><span class="text-muted small">${esc(m.author_or_channel || m.source || '')}</span></div>

      <button class="btn ${done ? 'soft' : 'primary'} small" type="button" data-action="toggle-material" data-material="${escAttr(m.id)}">${done ? 'Просмотрено' : 'Отметить просмотренным'}</button>

      function causalTask(t, i) {

      function renderInlineCards(cards, ownerId) {

      function renderInlineTests(tests, topicId, subject) {
        const list = arr(tests);

        return `<section class="panel test-list">
    <div class="section-head"><div><div class="eyebrow">Проверка</div><h2>Мини-тест</h2></div><span class="mono">${list.length} вопроса</span></div>
    ${list.map((t, i) => inlineTest(t, topicId, subject, i)).join('')}

      function inlineTest(t, topicId, subject, i) {

    <div class="quiz-options">${opts.map((o, j) => `<button type="button" class="quiz-option ${existing && j === existing.selected ? 'selected' : ''} ${existing && String(j) === String(t.correct_answer) ? 'correct' : ''} ${existing && j === existing.selected && String(j) !== String(t.correct_answer) ? 'wrong' : ''}" ${existing ? 'disabled' : ''} data-action="inline-answer" data-inline-key="${escAttr(key)}" data-inline-index="${i}" data-inline-selected="${j}" data-inline-correct="${escAttr(t.correct_answer)}" data-inline-subject="${subject}" data-inline-topic="${escAttr(t.topic || '')}">

        const opts = arr(item.options);

        saveState();
      }

      function render() {
        if (!data) return;
        if (!state.settings.onboardingComplete) {
          document.body.innerHTML = renderOnboarding();
          return;
        }
        document.body.innerHTML = shell();
        const root = $('#page');
        const [base, param, param2] = viewState.route.split('/');
        let html = '';
        if (base === 'home') html = renderHome();
        else if (base === 'plan') html = renderPlan();
        else if (base === 'math') html = renderSubject('mathematics');
        else if (base === 'russian') html = renderSubject('russian_language');
        else if (base === 'literature' && param) html = renderLiteratureDetail(param);
        else if (base === 'literature') html = renderLiterature();
        else if (base === 'history') html = renderSubject('history');
        else if (base === 'flashcards') html = renderFlashcards();
        else if (base === 'tests') html = renderTests();
        else if (base === 'progress') html = renderProgress();
        else if (base === 'subject') html = renderSubject(param);
        else if (base === 'week') html = renderWeekDetail(param, param2);
        else html = errorView('Раздел не найден', 'Маршрут не существует. Вернись на главную.');
        root.innerHTML = html;
        saveNavigation(viewState.route);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function startApp() {
        state = loadState();
        ensureStateShape();
        viewState.route = (location.hash || '').replace(/^#/, '') || state.navigation.lastRoute || 'home';
        viewState.route = viewState.route === 'settings' ? 'home' : viewState.route;
        try {
          assertData(data);
          document.body.setAttribute('data-ready', 'true');
          render();
        } catch (error) {
          document.body.innerHTML = errorView('Не удалось открыть базу', 'Структура data.json не прошла проверку.', error.message);
        }
      }

      async function loadData() {
        setTimeout(() => { if (!data && !document.body.getAttribute('data-loading-done')) document.body.innerHTML = loadingView() }, 50);
        try {
          const response = await fetch('./data.json', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const parsed = await response.json();
          assertData(parsed);
          data = parsed;
          document.body.setAttribute('data-loading-done', 'true');
          startApp();
        } catch (error) {
          const fileMode = location.protocol === 'file:';
          document.body.innerHTML = `
      <div class="error-view fatal">
        <div class="error-mark">${icon('alert')}</div>
        <div><div class="eyebrow">Не удалось загрузить data.json</div><h1>База обучения недоступна</h1>
        <p>${esc(error.message || 'Неизвестная ошибка')}</p>
        <p>${fileMode ? 'Браузер блокирует fetch() при открытии HTML через file://. Запусти папку проекта через локальный HTTP-сервер, например <strong>python -m http.server</strong>, и открой адрес сервера.' : 'Проверь, что index.html и data.json находятся в одной папке и доступны из браузера.'}</p>
        <button class="btn primary" type="button" data-action="retry-load">Повторить загрузку</button></div>
      </div>`;
        }
      }

      function resetProgress() {
        if (!confirm('Сбросить весь учебный прогресс? Это удалит отметки тем, книг, карточек и историю тестов.')) return;
        state = defaultState(); state.settings.onboardingComplete = true;
        saveState(); closeModal(); toast('Прогресс сброшен', 'success'); render();
      }

      function openSearch() {
        openModal(`<div class="modal-backdrop" data-action="close-modal"><section class="modal large" role="dialog" aria-modal="true" aria-labelledby="search-title" onclick="event.stopPropagation()">
    <div class="modal-head"><div><h2 id="search-title">Поиск по базе</h2><p>Темы, произведения, термины, карточки и формулы.</p></div><button class="icon-button" type="button" data-action="close-modal" aria-label="Закрыть">${icon('close')}</button></div>
    <div class="search-input-wrap"><input id="global-search" class="input" type="search" autofocus placeholder="Например, квадратное уравнение"><span class="shortcut">Esc</span></div>
    <div id="global-search-results" class="search-results"></div>
  </section></div>`);
        $('#global-search')?.focus();
        runSearch('');
      }
      function runSearch(query) {
        const root = $('#global-search-results'); if (!root) return;
        const q = String(query || '').toLowerCase().trim();
        if (!q) { root.innerHTML = '<div class="empty-state"><strong>Начни вводить запрос</strong><span>Поиск проходит по реальному содержимому data.json.</span></div>'; return; }
        const groups = [];
        const add = (title, items) => { if (items.length) groups.push({ title, items: items.slice(0, 8) }) };
        add('Темы', [
          ...subjectWeeks('mathematics').filter(w => searchIn(`${w.title} ${w.explanation} ${arr(w.rules).join(' ')}`, q)).map(w => ({ title: w.title, meta: `Математика · неделя ${w.week}`, route: `week/math/${w.week}` })),
          ...subjectWeeks('russian_language').filter(w => searchIn(`${w.title} ${w.explanation} ${arr(w.rules).join(' ')}`, q)).map(w => ({ title: w.title, meta: `Русский язык · неделя ${w.week}`, route: `week/rus/${w.week}` })),
          ...subjectWeeks('history').filter(w => searchIn(`${w.title} ${w.summary} ${arr(w.terms).join(' ')}`, q)).map(w => ({ title: w.title, meta: `История · неделя ${w.week}`, route: `week/hist/${w.week}` }))
        ]);
        add('Произведения', arr(data.subjects?.literature?.works).filter(w => searchIn(`${w.author} ${w.title} ${arr(w.themes).join(' ')} ${w.plot_summary}`, q)).map(w => ({ title: w.title, meta: `${w.author} · ${w.year || '—'}`, route: `literature/${w.id}` })));
        add('Термины', arr(data.subjects?.history?.weeks).flatMap(w => arr(w.terms).filter(t => searchIn(t, q)).map(t => ({ title: t, meta: `История · ${w.title}`, route: `week/hist/${w.week}` }))));
        add('Карточки', allFlashcards().filter(c => searchIn(`${c.question} ${c.answer} ${c.topic} ${c.tags?.join(' ')}`, q)).map(c => ({ title: c.question, meta: `${subjectName(c.subject)} · ${c.topic || ''}`, route: 'flashcards' })));
        add('Формулы', arr(data.subjects?.mathematics?.weeks).flatMap(w => arr(w.key_formulas).filter(f => searchIn(f, q)).map(f => ({ title: f, meta: `Математика · неделя ${w.week}`, route: `week/math/${w.week}` }))));
        if (!groups.length) { root.innerHTML = '<div class="empty-state"><strong>Совпадений нет</strong><span>Попробуй более короткий запрос или другой термин.</span></div>'; return; }
        root.innerHTML = groups.map(g => `<div class="search-group"><h3>${esc(g.title)}</h3>${g.items.map(x => `<button class="search-item" type="button" data-search-route="${escAttr(x.route)}"><strong>${esc(x.title)}</strong><span>${esc(x.meta)}</span></button>`).join('')}</div>`).join('');
      }
      function searchIn(text, q) { return String(text || '').toLowerCase().includes(q) }

      function startFlash() {
        const fs = viewState.flashFilters;
        let cards = dataCards(fs.subject, fs.topic, fs.difficulty);
        if (!cards.length) { toast('Для этих фильтров нет карточек', 'error'); return; }
        cards = cards.slice().sort(() => Math.random() - .5).slice(0, Math.min(Number(fs.count) || 10, cards.length));
        viewState.flashSession = { cards, index: 0, known: 0, repeat: 0, flipped: false, sessionKnown: {} };
        render();
      }
      function finishFlash() {
        if (viewState.flashSession) { viewState.flashSession = null; render() }
      }
      function flashKnow() {
        const s = viewState.flashSession, card = s.cards[s.index]; if (!s || !card) return;
        setCard(card.id, true); s.known++; s.sessionKnown[card.id] = true; s.index++; s.flipped = false; saveState(); render();
      }
      function flashRepeat() {
        const s = viewState.flashSession; if (!s) return;
        if (!s.flipped) return;
        const card = s.cards[s.index];
        s.cards.push(card); s.repeat++; s.index++; s.flipped = false; saveState(); render();
      }
      function startTest() {
        const tf = viewState.testFilters; let qs = testQuestions(tf.subject, tf.topic);
        if (!qs.length) { toast('Для этих фильтров нет тестовых вопросов', 'error'); return; }
        qs = qs.slice().sort(() => Math.random() - .5).slice(0, Math.min(Number(tf.count) || 4, qs.length)).map(normalizeTest);
        viewState.quizSession = { questions: qs, index: 0, answers: Array(qs.length).fill(null), finished: false, saved: false, attempts: 1 };
        render();
      }
      function normalizeTest(t) {
        const subject = t.subject || (
          t.id?.startsWith('math_') ? 'mathematics' :
            t.id?.startsWith('rus_') ? 'russian_language' :
              t.id?.startsWith('hist_') ? 'history' : null
        );
        return { ...t, subject };
      }
      function quizAnswer(index) {
        const q = viewState.quizSession; if (!q || q.finished) return;
        if (q.answers[q.index] !== null) return;
        q.answers[q.index] = Number(index); render();
      }
      function findWeekIdForTest(subject, testId) {
        const w = subjectWeeks(subject).find(x => arr(x.tests).some(t => t.id === testId));
        return w?.id || null;
      }
      function quizNext() {
        const q = viewState.quizSession; if (!q) return;
        if (q.index < q.questions.length - 1) { q.index++; render(); return; }
        q.finished = true;
        if (!q.saved) {
          const score = q.questions.reduce((n, item, i) => n + (Number(q.answers[i]) === correctIndex(item) ? 1 : 0), 0);
          const weekIds = [...new Set(q.questions.map(t => findWeekIdForTest(t.subject, t.id)).filter(Boolean))];
          const topics = [...new Set(q.questions.map(t => t.topic).filter(Boolean))];
          recordTest({ id: `attempt_${Date.now()}`, date: new Date().toISOString(), title: `Тест: ${subjectName(q.questions[0].subject)}`, subject: q.questions[0].subject, score, correct: score, total: q.questions.length, weekIds, topics });
          q.saved = true; saveState();
        }
        toast(`Тест завершён: ${score}/${q.questions.length}`, 'success');
        render();
      }
      function repeatTest() {
        const q = viewState.quizSession; if (!q) return;
        q.answers = Array(q.questions.length).fill(null); q.index = 0; q.finished = false; q.saved = false; q.attempts++;
        render();
      }
      function normalizeInlineAnswer(key, selected, subject, topic, t) {
        const existing = state.ui.inlineTests[key]; if (existing) return;
        const correct = String(selected) === String(t.correct_answer);
        state.ui.inlineTests[key] = { selected: Number(selected), correct, date: new Date().toISOString() };
        saveState(); toast(correct ? 'Верно' : 'Ответ зафиксирован', correct ? 'success' : '');
        render();
      }

      function handleAction(action, el) {
        const d = el.dataset;
        if (action === 'search') return openSearch();
        if (action === 'settings') return openModal(renderSettingsModal());
        if (action === 'close-modal') return closeModal();
        if (action === 'mobile-menu') return openMobileMenu();
        if (action === 'retry-load') return loadData();
        if (action === 'reset-progress') return resetProgress();
        if (action === 'continue-week') return setRoute(`week/math/${d.week}`);
        if (action === 'go-literature') return setRoute('literature');
        if (action === 'open-topic') return setRoute(`week/${d.subject === 'mathematics' ? 'math' : d.subject === 'russian_language' ? 'rus' : 'hist'}/${d.week}`);
        if (action === 'open-history-week') return setRoute(`week/hist/${d.week}`);
        if (action === 'open-history-material') {
          const m = arr(data.subjects?.history?.documentary_materials).find(x => x.id === d.material);
          if (m) openModal(renderMaterialModal(m)); return;
        }
        if (action === 'toggle-topic') { setTopic(d.subject, d.id, !topicDone(d.subject, d.id)); toast(topicDone(d.subject, d.id) ? 'Тема отмечена как изученная' : 'Тема возвращена в план', 'success'); render(); return }
        if (action === 'toggle-read') { setRead(d.work, !readWork(d.work)); toast(readWork(d.work) ? 'Произведение отмечено как прочитанное' : 'Отметка снята', 'success'); render(); return }
        if (action === 'toggle-analysis') { setAnalysis(d.work, !analysisDone(d.work)); toast(analysisDone(d.work) ? 'Анализ отмечен' : 'Отметка анализа снята', 'success'); render(); return }
        if (action === 'toggle-essay') { setEssay(d.essay, !essayDone(d.essay)); toast(essayDone(d.essay) ? 'Сочинение отмечено' : 'Отметка снята', 'success'); render(); return }
        if (action === 'toggle-material') { setMaterial(d.material, !materialDone(d.material)); toast(materialDone(d.material) ? 'Материал отмечен как просмотренный' : 'Отметка снята', 'success'); render(); return }
        if (action === 'check-task') return checkTask(el);
        if (action === 'flip-card') { const s = viewState.flashSession; if (s) { s.flipped = !s.flipped; render() } return }
        if (action === 'flash-know') return flashKnow();
        if (action === 'flash-repeat') return flashRepeat();
        if (action === 'start-flash') return startFlash();
        if (action === 'reset-flash') { viewState.flashSession = null; render(); return }
        if (action === 'start-test') return startTest();
        if (action === 'quiz-answer') return quizAnswer(d.index);
        if (action === 'quiz-next') return quizNext();
        if (action === 'repeat-test') return repeatTest();
        if (action === 'exit-test') { viewState.quizSession = null; setRoute('tests'); return }
        if (action === 'inline-answer') return inlineAnswer(el);
        if (action === 'reset-subject-filter') { const s = d.subject; viewState.filters.subjectSearch[s] = ''; viewState.filters.subjectDifficulty[s] = 'all'; render(); return }
        if (action === 'open-work') return setRoute(`literature/${d.work}`);
        if (action === 'quick-ortho') { viewState.flashFilters = { subject: 'russian_language', topic: 'Орфоэпия', difficulty: 'all', count: 10 }; viewState.flashSession = null; setRoute('flashcards'); return }
        if (action === 'reveal-causal') { setTask('history', d.taskId, true); toast('Ответ зафиксирован для повторения', 'success'); render(); return }
      }

      function correctIndex(t) {
        const raw = t?.correct_answer;
        if (typeof raw === 'number') return raw;
        const s = String(raw ?? '').trim().toUpperCase();
        if (['A', 'B', 'C', 'D'].includes(s)) return ['A', 'B', 'C', 'D'].indexOf(s);
        const n = Number(s);
        return Number.isInteger(n) ? n : -1;
      }
      function optionText(o) {
        return String(o ?? '').replace(/^\s*[A-DА-Г][\):.]\s*/i, '');
      }
      function testQuestions(subject, topic) {
        return allTests().filter(t =>
          (!subject || t.subject === subject) &&
          (!topic || t.topic === topic)
        );
      }
      function normalizeTest(t) {
        const subject = t.subject || (
          t.id?.startsWith('test_math_') || t.id?.startsWith('math_') ? 'mathematics' :
            t.id?.startsWith('test_rus_') || t.id?.startsWith('rus_') ? 'russian_language' :
              t.id?.startsWith('hist_') ? 'history' : null
        );
        return { ...t, subject };
      }
      function renderInlineTests(tests, topicId, subject) {
        const list = arr(tests);
        if (!list.length) return '';
        return `<section class="panel test-list">
    <div class="section-head"><div><div class="eyebrow">Проверка</div><h2>Мини-тест</h2></div><span class="mono">${list.length} вопрос${list.length === 1 ? '' : 'а'}</span></div>
    ${list.map((t, i) => inlineTest(t, topicId, subject, i)).join('')}
  </section>`;
      }
      function inlineTest(t, topicId, subject, i) {
        const key = `inline:${topicId}:${i}`, existing = state.ui.inlineTests?.[key], ci = correctIndex(t);
        const opts = arr(t.options), letters = ['A', 'B', 'C', 'D'];
        return `<article class="test-card ${existing ? (existing.correct ? 'correct' : 'wrong') : ''}">
    <div class="test-question"><span>${String(i + 1).padStart(2, '0')}</span><strong>${esc(t.question || '')}</strong></div>
    <div class="quiz-options">${opts.map((o, j) => `<button type="button" class="quiz-option ${existing && j === existing.selected ? 'selected' : ''} ${existing && j === ci ? 'correct' : ''} ${existing && j === existing.selected && j !== ci ? 'wrong' : ''}" ${existing ? 'disabled' : ''} data-action="inline-answer" data-inline-key="${escAttr(key)}" data-inline-index="${i}" data-inline-selected="${j}" data-inline-subject="${subject}" data-inline-topic="${escAttr(t.topic || '')}" data-inline-correct="${ci}">
      <span class="letter">${letters[j]}</span><span>${esc(optionText(o))}</span>
    </button>`).join('')}</div>
    ${existing ? `<div class="quiz-explanation"><strong>${existing.correct ? 'Верно.' : 'Ответ зафиксирован.'}</strong> ${esc(t.explanation || '')}</div>` : ''}
  </article>`;
      }
      function renderQuizSession() {
        const q = viewState.quizSession;
        if (q.finished) return renderQuizResult();
        const item = q.questions[q.index], selected = q.answers[q.index], ci = correctIndex(item);
        const answered = selected !== null && selected !== undefined;
        const correct = answered && Number(selected) === ci;
        const opts = arr(item.options);
        return `<div class="view">
    ${layoutHeader('Тест', 'Проверка знаний', `${subjectName(item.subject)} · ${item.topic || ''}`)}
    <div class="quiz-card">
      <div class="quiz-progress-head"><strong>${q.index + 1} / ${q.questions.length}</strong><span>${q.answers.filter(v => v !== null).length} ответа зафиксировано</span></div>
      ${progressBar(percent(q.index, q.questions.length), 'Прогресс')}
      <div class="quiz-question">${esc(item.question || '')}</div>
      <div class="quiz-options">${opts.map((o, i) => `<button type="button" class="quiz-option ${answered && i === selected ? 'selected' : ''} ${answered && i === ci ? 'correct' : ''} ${answered && i === selected && i !== ci ? 'wrong' : ''}" ${answered ? 'disabled' : ''} data-action="quiz-answer" data-index="${i}">
        <span class="letter">${['A', 'B', 'C', 'D'][i]}</span><span>${esc(optionText(o))}</span>
      </button>`).join('')}</div>
      ${answered ? `<div class="quiz-explanation"><strong>${correct ? 'Верно.' : 'Неверно.'}</strong> ${esc(item.explanation || '')}</div>` : ''}
      <div class="quiz-actions">${btn('Выйти из теста', 'exit-test', { soft: true })}${answered ? btn(q.index === q.questions.length - 1 ? 'Завершить' : 'Следующий вопрос', 'quiz-next', { primary: true }) : chip('Выбери ответ')}</div>
    </div>
  </div>`;
      }
      function renderQuizResult() {
        const q = viewState.quizSession;
        const score = q.questions.reduce((n, item, i) => n + (Number(q.answers[i]) === correctIndex(item) ? 1 : 0), 0);
        const mistakes = q.questions.map((item, i) => ({ item, index: i, answer: q.answers[i] })).filter(x => Number(x.answer) !== correctIndex(x.item));
        return `<div class="view">
    ${layoutHeader('Результат', 'Тест завершён', 'Попытка сохранена в статистике.')}
    <div class="result-hero panel"><div class="result-score">${score}/${q.questions.length}</div><div class="result-label">правильных ответов</div><div style="max-width:420px;margin:18px auto">${progressBar(percent(score, q.questions.length), 'Результат')}</div>
      <div class="quiz-actions">${btn('Повторить тест', 'repeat-test', { primary: true })}${btn('К тестам', 'exit-test', { soft: true })}</div>
    </div>
    <section class="panel" style="margin-top:16px"><div class="section-head"><div><div class="eyebrow">Разбор</div><h2>Ошибки</h2></div><span class="mono">${mistakes.length}</span></div>
      ${mistakes.length ? `<div class="mistake-list">${mistakes.map(m => `<div class="mistake-item"><strong>${String(m.index + 1).padStart(2, '0')}. ${esc(m.item.question || '')}</strong><span>Твой ответ: ${esc(arr(m.item.options)[m.answer] !== undefined ? optionText(arr(m.item.options)[m.answer]) : 'не выбран')}</span><span>Правильный: ${esc(arr(m.item.options)[correctIndex(m.item)] || '')}</span><p>${esc(m.item.explanation || '')}</p></div>`).join('')}</div>` : `<div class="empty-state"><strong>Ошибок нет</strong><span>Все ответы правильные.</span></div>`}
    </section>
  </div>`;
      }
      function inlineAnswer(el) {
        const key = el.dataset.inlineKey;
        if (state.ui.inlineTests?.[key]) return;
        const parts = key.split(':'), weekId = parts[1], qIndex = Number(parts[2]);
        const subject = el.dataset.inlineSubject;
        const w = subjectWeeks(subject).find(x => x.id === weekId);
        const test = arr(w?.tests)[qIndex];
        if (!test) return;
        const selected = Number(el.dataset.inlineSelected);

        state.ui.inlineTests[key] = { selected, correct, date: new Date().toISOString(), subject, topic: test.topic || '' };

      }
      function checkTask(el) {
