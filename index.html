        const input = document.querySelector(`[data-task-input="${CSS.escape(key)}"]`);
        const value = input?.value.trim() || '';
        if (!value) { toast('Введи ответ перед проверкой', 'error'); input?.focus(); return }
        const correct = answerLooksRight(value, el.dataset.taskAnswer);

        const parts = key.split(':');
        const subject = parts[0].startsWith('math_') ? 'mathematics' : parts[0].startsWith('rus_') ? 'russian_language' : parts[0].startsWith('hist_') ? 'history' : null;

      function causalTask(t, i) {
        const id = t.id || `history-causal-${i}`, done = taskDone('history', id);
        const question = typeof t === 'string' ? t : t.question || t.condition || '', answer = typeof t === 'string' ? '' : t.answer || '';
        return `<article class="task-card ${done ? 'correct' : ''}">
    <div class="task-top"><span class="task-number">${String(i).padStart(2, '0')}</span><span class="difficulty ${t.difficulty || 'medium'}">${esc(levelLabel(t.difficulty || 'medium'))}</span></div>

  </article>`;
      }

      function openMobileMenu() {
        const links = navItems.map(n => `<a class="nav-link ${isNavActive(n.id) ? 'active' : ''}" href="#${n.id}" data-route="${n.id}"><span class="nav-icon">${icon(n.icon)}</span><span>${esc(n.label)}</span></a>`).join('');
        openModal(`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="mobile-nav-title" onclick="event.stopPropagation()"><div class="modal-head"><div><h2 id="mobile-nav-title">Разделы</h2><p>Учебный кабинет</p></div><button class="icon-button" type="button" data-action="close-modal" aria-label="Закрыть">${icon('close')}</button></div><nav class="nav">${links}</nav></section></div>`);
      }
      function renderMaterialModal(m) {
        return `<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="material-title" onclick="event.stopPropagation()">
    <div class="modal-head"><div><div class="eyebrow">${esc(m.type || 'Материал')}</div><h2 id="material-title">${esc(m.title || '')}</h2><p>${esc(m.author_or_channel || m.source || '')}</p></div><button class="icon-button" type="button" data-action="close-modal" aria-label="Закрыть">${icon('close')}</button></div>
    <p>${esc(m.why_watch || '')}</p>
    <div class="modal-actions">
      ${m.url && /^https?:\/\//i.test(m.url) ? `<a class="btn soft" target="_blank" rel="noopener noreferrer" href="${escAttr(m.url)}">Смотреть материал</a>` : ''}
      ${btn(materialDone(m.id) ? 'Просмотрено' : 'Отметить просмотренным', 'toggle-material', { primary: !materialDone(m.id), data: `data-material="${escAttr(m.id)}"` })}
    </div>
  </section></div>`;
      }

      function handleRouteClick(el) {
        const route = el.dataset.route;
        if (route) {
          closeModal();
          setRoute(route);
          return true;
        }
        const searchRoute = el.dataset.searchRoute;
        if (searchRoute) {
          closeModal();
          setRoute(searchRoute);
          return true;
        }
        return false;
      }

      document.addEventListener('click', event => {
        const routeEl = event.target.closest('[data-route],[data-search-route]');
        if (routeEl) {
          event.preventDefault();
          if (handleRouteClick(routeEl)) return;
        }
        const actionEl = event.target.closest('[data-action]');
        if (actionEl) {
          event.preventDefault();
          handleAction(actionEl.dataset.action, actionEl);
        }
      });

      document.addEventListener('click', event => {
        const backdrop = event.target.closest('.modal-backdrop');
        if (backdrop && event.target === backdrop) closeModal();
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          if ($('#modal-root')?.innerHTML) closeModal();
          return;
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          openSearch();
        }
      });

      document.addEventListener('input', event => {
        const el = event.target;
        if (el.matches('#global-search')) { runSearch(el.value); return; }
        if (el.matches('[data-subject-search]')) {
          const s = el.dataset.subjectSearch, value = el.value, caret = el.selectionStart ?? value.length;
          viewState.filters.subjectSearch[s] = value;
          render();
          const next = document.querySelector(`[data-subject-search="${CSS.escape(s)}"]`);
          next?.focus(); try { next?.setSelectionRange(caret, caret) } catch { }
          return;
        }
        if (el.matches('[data-lit-search]')) {
          const value = el.value, caret = el.selectionStart ?? value.length;
          viewState.filters.literature.query = value;
          render();
          const next = document.querySelector('[data-lit-search]'); next?.focus(); try { next?.setSelectionRange(caret, caret) } catch { }
        }
      });

      document.addEventListener('change', event => {
        const el = event.target;
        if (el.matches('[data-subject-difficulty]')) {
          viewState.filters.subjectDifficulty[el.dataset.subjectDifficulty] = el.value; render();
        }
        if (el.matches('[data-lit-period]')) {
          viewState.filters.literature.period = el.value; render();
        }
        if (el.matches('[data-flash-subject]')) {
          viewState.flashFilters.subject = el.value; viewState.flashFilters.topic = ''; render();
        }
        if (el.matches('[data-flash-topic]')) { viewState.flashFilters.topic = el.value; render() }
        if (el.matches('[data-flash-difficulty]')) { viewState.flashFilters.difficulty = el.value; render() }
        if (el.matches('[data-flash-count]')) { viewState.flashFilters.count = Number(el.value); render() }
        if (el.matches('[data-test-subject]')) { viewState.testFilters.subject = el.value; viewState.testFilters.topic = ''; render() }
        if (el.matches('[data-test-topic]')) { viewState.testFilters.topic = el.value; render() }
        if (el.matches('[data-test-count]')) { viewState.testFilters.count = Number(el.value); render() }
      });

      document.addEventListener('submit', event => {
        const form = event.target;
        if (form.matches('[data-onboarding-form]')) {
          event.preventDefault();
          const fd = new FormData(form);
          state.settings.name = safeText(fd.get('name')).slice(0, 50);
          state.settings.goal = safeText(fd.get('goal'), 'Вступительные испытания в СУНЦ');
          state.settings.currentWeek = clamp(Number(fd.get('week')) || 1, 1, 26);
          state.settings.dailyMinutes = clamp(Number(fd.get('minutes')) || 60, 15, 240);
          state.settings.onboardingComplete = true;
          saveState();
          toast('Кабинет готов', 'success');
          render();
          setTimeout(() => document.querySelector('[data-action="continue-week"]')?.focus(), 50);
        }
        if (form.matches('[data-settings-form]')) {
          event.preventDefault();
          const fd = new FormData(form);
          state.settings.name = safeText(fd.get('name')).slice(0, 50);
          state.settings.goal = safeText(fd.get('goal'), 'Вступительные испытания в СУНЦ');
          state.settings.currentWeek = clamp(Number(fd.get('week')) || 1, 1, 26);
          state.settings.dailyMinutes = clamp(Number(fd.get('minutes')) || 60, 15, 240);
          saveState(); closeModal(); toast('Настройки сохранены', 'success'); render();
        }
      });

      document.addEventListener('change', event => {
        const el = event.target;
        if (el.matches('[data-current-week]')) { setCurrentWeek(el.value); render() }
      });

      window.addEventListener('popstate', () => {
        viewState.route = (location.hash || '').replace(/^#/, '') || 'home';
        render();
      });
      window.addEventListener('hashchange', () => {
        viewState.route = (location.hash || '').replace(/^#/, '') || 'home';
        render();
      });

      function ensureViewState() {
        viewState.filters = viewState.filters || {};
        viewState.filters.subjectSearch = viewState.filters.subjectSearch || { mathematics: '', russian_language: '', history: '' };
        viewState.filters.subjectDifficulty = viewState.filters.subjectDifficulty || { mathematics: 'all', russian_language: 'all', history: 'all' };
        viewState.filters.literature = viewState.filters.literature || { query: '', period: 'all' };
        viewState.flashFilters = viewState.flashFilters || { subject: '', topic: '', difficulty: 'all', count: 10 };
        viewState.testFilters = viewState.testFilters || { subject: '', topic: '', count: 4 };
      }
      function subjectName(id) { return SUBJECT_META[id]?.title || id }
      function subjectClass(id) { return ({ mathematics: 'subject-accent-math', russian_language: 'subject-accent-rus', literature: 'subject-accent-lit', history: 'subject-accent-history' })[id] || '' }
      function subjectMeta(id) {
        const m = SUBJECT_META[id] || {};
        return { label: m.title || id, description: data?.subjects?.[id]?.description || '', color: m.color || 'var(--ink)', icon: m.icon || 'book', className: subjectClass(id), eyebrow: id === 'mathematics' ? 'Алгебра и геометрия' : id === 'russian_language' ? 'Язык и речь' : id === 'literature' ? 'Чтение и анализ' : 'Хронология и причинность' };
      }
      function shell() {
        return `<div class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div class="brand-text"><strong>СУНЦ Prep 9</strong><span>личный учебный кабинет</span></div></div>
      <nav class="nav"><div class="nav-label">Учёба</div>
        ${navItems.map(n => `<a class="nav-link ${isNavActive(n.route) ? 'active' : ''}" href="#${n.route}" data-route="${n.route}" aria-current="${isNavActive(n.route) ? 'page' : 'false'}"><span class="nav-icon">${icon(n.icon)}</span><span>${esc(n.label)}</span></a>`).join('')}
      </nav>
      <div class="sidebar-bottom"><div class="user-chip"><div class="eyebrow">Текущая неделя</div><strong>${state.settings.name ? esc(state.settings.name) : 'Ученица 9 класса'}</strong><span class="text-muted small">Неделя ${state.settings.currentWeek} из 26</span></div><button class="icon-button" type="button" data-action="settings" aria-label="Открыть настройки">${icon('settings')}</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="topbar-left"><button class="icon-button mobile-menu" type="button" data-action="mobile-menu" aria-label="Открыть меню">${icon('menu')}</button><div class="breadcrumb"><span>СУНЦ Prep 9</span><span>›</span><strong>${esc(routeLabel(viewState.route))}</strong></div></div>
        <div class="top-actions"><button class="search-trigger" type="button" data-action="search" aria-label="Открыть глобальный поиск">${icon('search')}<span>Поиск по базе</span><span class="shortcut">Ctrl K</span></button><button class="icon-button" type="button" data-action="settings" aria-label="Настройки">${icon('settings')}</button></div>
      </header>
      <div id="page" class="page-wrap"></div>
    </main>
    <nav class="mobile-nav" aria-label="Мобильная навигация">${navItems.slice(0, 5).map(n => `<a href="#${n.route}" class="${isNavActive(n.route) ? 'active' : ''}" data-route="${n.route}"><span>${icon(n.icon)}</span><small>${esc(n.label)}</small></a>`).join('')}</nav>
    <div id="modal-root"></div><div id="toast-root" class="toast-stack" aria-live="polite"></div>
  </div>`;
      }
      function isNavActive(id) {
        const r = viewState.route;
        if (id === 'home') return r === 'home';
        if (id === 'mathematics') return r === 'math' || r.startsWith('subject/mathematics') || r.startsWith('week/math');
        if (id === 'russian_language') return r === 'russian' || r.startsWith('subject/russian_language') || r.startsWith('week/rus');
        if (id === 'literature') return r === 'literature' || r.startsWith('literature/');
        if (id === 'history') return r === 'history' || r.startsWith('subject/history') || r.startsWith('week/hist');
        return r === id;
      }
      function renderSubject(subject) {
        if (subject === 'literature') return renderLiterature();
        const weeks = subjectWeeks(subject), meta = subjectMeta(subject), prog = subjectProgress(subject);
        const difficulty = viewState.filters.subjectDifficulty[subject] || 'all', query = (viewState.filters.subjectSearch[subject] || '').toLowerCase().trim();
        const topics = weeks.filter(w => {
          const text = `${w.title || ''} ${w.explanation || w.summary || ''} ${w.section || ''} ${arr(w.rules).join(' ')}`.toLowerCase();
          return (!query || text.includes(query)) && (difficulty === 'all' || [w.training_tasks, w.advanced_tasks].some(a => arr(a).some(t => t.difficulty === difficulty)) || arr(w.flashcards).some(c => c.difficulty === difficulty));
        });
        const list = subject === 'history' ? topics.map(w => historyCard(w)).join('') : topics.map(w => subjectTopicCard(w, subject)).join('');
        return `<div class="view">
    <div class="subject-head ${meta.className}" style="--subject-color:${meta.color}">
      <div class="subject-mark" aria-hidden="true">${icon(meta.icon)}</div>
      <div class="subject-heading"><div class="eyebrow">${esc(meta.eyebrow)}</div><h1>${esc(meta.label)}</h1><p>${esc(meta.description)}</p></div>
      <div class="subject-stats"><strong>${prog}%</strong><span>тем отмечено</span>${progressBar(prog, '')}</div>
    </div>
    <div class="subject-toolbar">
      <label class="field"><span>Поиск тем</span><input class="input" type="search" value="${escAttr(viewState.filters.subjectSearch[subject] || '')}" data-subject-search="${subject}" placeholder="Название темы"></label>
      <label class="field"><span>Сложность</span><select class="select" data-subject-difficulty="${subject}"><option value="all" ${difficulty === 'all' ? 'selected' : ''}>Все уровни</option><option value="easy" ${difficulty === 'easy' ? 'selected' : ''}>Базовый</option><option value="medium" ${difficulty === 'medium' ? 'selected' : ''}>Средний</option><option value="hard" ${difficulty === 'hard' ? 'selected' : ''}>Повышенный</option></select></label>
    </div>
    ${subject === 'russian_language' ? renderOrthoSection() : ''}
    ${topics.length ? `<div class="${subject === 'history' ? 'timeline' : 'subject-list'}">${list}</div>` : `<div class="empty-state panel"><strong>Ничего не найдено</strong><span>Измени запрос или сбрось фильтр.</span>${btn('Сбросить фильтры', 'reset-subject-filter', { small: true, data: `data-subject="${subject}"` })}</div>`}
  </div>`;
      }
      function renderOrthoSection() {
        const cards = arr(data.subjects?.russian_language?.orthopyepy_cards || data.subjects?.russian_language?.orthoepy_cards);
        return `<section class="panel" style="margin-bottom:18px"><div class="section-head"><div><div class="eyebrow">Орфоэпия</div><h2>Ударения</h2><p class="page-subtitle">В базе ${cards.length} карточек. Для быстрой тренировки используется отдельный режим повторения.</p></div>${btn('Быстрое повторение', 'quick-ortho', { small: true, primary: true })}</div>
    <div class="chips">${cards.slice(0, 10).map(c => chip(c.correct_stress || c.word)).join('')}</div></section>`;
      }

      function weekChecklist(n) {
        const p = data.weekly_plan[n - 1] || {}, m = findWeekForSubject('mathematics', n), r = findWeekForSubject('russian_language', n), h = findWeekForSubject('history', n);
        const w = arr(data.subjects.literature.works).find(x => x.title === p.literature_work) || arr(data.subjects.literature.works)[n - 1];
        const e = arr(data.subjects.literature.essays).find(x => x.formulation === p.literature_essay) || arr(data.subjects.literature.essays)[n - 1];
        const mat = getMaterialForWeek(n);
        const mTasks = [...arr(m?.training_tasks), ...arr(m?.advanced_tasks)], rTasks = arr(r?.training_tasks), hTasks = arr(h?.causal_tasks);
        const mathPractice = mTasks.some((_, i) => taskDone('mathematics', `${m?.id}:task:${i}`));
        const rusPractice = rTasks.some((_, i) => taskDone('russian_language', `${r?.id}:task:${i}`));
        const histPractice = hTasks.some(t => taskDone('history', t.id));
        const inlineDone = id => Object.keys(state.ui.inlineTests || {}).some(k => k.startsWith(`inline:${id}:`));
        const testFor = (subject, week) => !!week && state.progress.tests.some(x => x.subject === subject && (arr(x.weekIds).includes(week.id) || x.weekId === week.id));
        const items = [
          !!m && topicDone('mathematics', m.id), mathPractice, inlineDone(m?.id) || testFor('mathematics', m),
          !!r && topicDone('russian_language', r.id), rusPractice, inlineDone(r?.id) || testFor('russian_language', r) || arr(r?.flashcards).some(c => cardDone(c.id)),
          !!w && readWork(w.id), !!w && analysisDone(w.id), !!e && essayDone(e.id),
          !!h && topicDone('history', h.id), histPractice, arr(h?.flashcards).some(c => cardDone(c.id)), !!mat && materialDone(mat.id), inlineDone(h?.id) || testFor('history', h)
        ];
        const done = items.filter(Boolean).length;
        return { plan: p, math: m, rus: r, hist: h, work: w, essay: e, material: mat, done, total: items.length, percent: percent(done, items.length), mathPractice, russianPractice: rusPractice, rusPractice, histPractice };
      }

      function renderHistoryMaterials() {
        const mats = arr(data.subjects?.history?.documentary_materials);
        if (!mats.length) return `<div class="empty-state"><strong>Материалов нет</strong><span>В базе не указаны дополнительные материалы.</span></div>`;
        return `<section class="panel" style="margin-top:18px">
    <div class="section-head"><div><div class="eyebrow">Документальные материалы</div><h2>Смотреть по ходу курса</h2></div><span class="mono">${mats.filter(m => materialDone(m.id)).length}/${mats.length}</span></div>
    <div class="today-grid">${mats.map(m => {
          const done = materialDone(m.id), hasUrl = /^https?:\/\//i.test(String(m.url || m.link || ''));
          return `<article class="study-item"><div class="subject-dot subject-accent-history"></div><div class="study-list"><strong>${esc(m.title || '')}</strong><span>${esc(m.author_or_channel || m.source || '')}</span><small>${esc(m.why_watch || '')}</small></div><button class="icon-button" type="button" data-action="open-history-material" data-material="${escAttr(m.id)}" aria-label="Открыть материал">${icon(hasUrl ? 'play' : 'arrow')}</button></article>`;
        }).join('')}</div>
  </section>`;
      }
      function renderSubject(subject) {
        if (subject === 'literature') return renderLiterature();
        const weeks = subjectWeeks(subject), meta = subjectMeta(subject), prog = subjectProgress(subject);
        const difficulty = viewState.filters.subjectDifficulty[subject] || 'all', query = (viewState.filters.subjectSearch[subject] || '').toLowerCase().trim();
        const topics = weeks.filter(w => {
          const text = `${w.title || ''} ${w.explanation || w.summary || ''} ${w.section || ''} ${arr(w.rules).join(' ')}`.toLowerCase();
          return (!query || text.includes(query)) && (difficulty === 'all' || [w.training_tasks, w.advanced_tasks].some(a => arr(a).some(t => t.difficulty === difficulty)) || arr(w.flashcards).some(c => c.difficulty === difficulty));
        });
        const list = subject === 'history' ? topics.map(w => historyCard(w)).join('') : topics.map(w => subjectTopicCard(w, subject)).join('');
        return `<div class="view">
    <div class="subject-head ${meta.className}" style="--subject-color:${meta.color}">
      <div class="subject-mark" aria-hidden="true">${icon(meta.icon)}</div>
      <div class="subject-heading"><div class="eyebrow">${esc(meta.eyebrow)}</div><h1>${esc(meta.label)}</h1><p>${esc(meta.description)}</p></div>
      <div class="subject-stats"><strong>${prog}%</strong><span>тем отмечено</span>${progressBar(prog, '')}</div>
    </div>
    <div class="subject-toolbar"><label class="field"><span>Поиск тем</span><input class="input" type="search" value="${escAttr(viewState.filters.subjectSearch[subject] || '')}" data-subject-search="${subject}" placeholder="Название темы"></label>
      <label class="field"><span>Сложность</span><select class="select" data-subject-difficulty="${subject}"><option value="all" ${difficulty === 'all' ? 'selected' : ''}>Все уровни</option><option value="easy" ${difficulty === 'easy' ? 'selected' : ''}>Базовый</option><option value="medium" ${difficulty === 'medium' ? 'selected' : ''}>Средний</option><option value="hard" ${difficulty === 'hard' ? 'selected' : ''}>Повышенный</option></select></label></div>
    ${subject === 'russian_language' ? renderOrthoSection() : ''}
    ${topics.length ? `<div class="${subject === 'history' ? 'timeline' : 'subject-list'}">${list}</div>` : `<div class="empty-state panel"><strong>Ничего не найдено</strong><span>Измени запрос или сбрось фильтр.</span>${btn('Сбросить фильтры', 'reset-subject-filter', { small: true, data: `data-subject="${subject}"` })}</div>`}
    ${subject === 'history' ? renderHistoryMaterials() : ''}
  </div>`;
      }

      const originalRender = render;
      render = function () {
        ensureStateShape();
        ensureViewState();
        originalRender();
      };

      loadData();
    })();
  </script>
</body>

</html>
